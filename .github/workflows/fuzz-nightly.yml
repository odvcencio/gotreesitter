name: fuzz-nightly

# Nightly coverage-guided fuzzing discovers Fuzz targets in every package.
# The target list comes from `go test -json -list`, so a new package or fuzz
# target is picked up without a hand-kept list.
#
# A normal package test only replays each target's seed corpus. This workflow runs the actual
# mutation-based fuzzing engine (`go test -fuzz`), which is what finds new
# crashers. It is intentionally kept out of the required PR-blocking path in
# ci.yml: a fuzz-discovered crasher should open a tracked follow-up, not
# block an unrelated PR merge.

on:
  schedule:
    # 41 minutes past the hour, distinct from ci.yml's 03:17 UTC nightly
    # exhaustive-parity run, so the two scheduled jobs do not contend for the
    # same runner minute.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Per-target fuzz duration (Go duration string, e.g. 30s, 2m)'
        required: false
        default: '30s'
      report:
        description: 'Open, update, and close fuzz-nightly issues for this manual run (a short fuzztime counts as a green night; use 30s or more)'
        type: boolean
        required: false
        default: false
      close_after:
        description: 'Consecutive green nights that close a fuzz issue'
        required: false
        default: '3'

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

permissions:
  contents: read

# VM runner services can share HOME and /tmp. Isolate their native Go
# caches and scratch, and disable setup-go archives, which retain producer
# paths. Hosted runners keep their standard cache paths and warm builds.
env:
  GOWORK: 'off'
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'

jobs:
  discover:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GTS_ISOLATED_RUNNER_LABELS != '' && fromJSON(vars.GTS_ISOLATED_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare job-owned Go cache and scratch
        if: runner.environment == 'self-hosted'
        run: bash .github/scripts/prepare_runner.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: ${{ runner.environment != 'self-hosted' }}
          go-version-file: go.mod

      - name: List Fuzz targets
        id: list
        shell: bash
        run: |
          set -euo pipefail
          GOWORK=off go test -json ./... -list '^Fuzz' -run '^$' > "${RUNNER_TEMP}/fuzz-discovery.jsonl"
          json="$(jq -sc '[.[] | select(.Action == "output" and ((.Output // "") | test("^Fuzz[A-Za-z0-9_]+\\n$"))) | {package: .Package, target: (.Output | rtrimstr("\n"))}] | unique_by(.package, .target)' "${RUNNER_TEMP}/fuzz-discovery.jsonl")"
          test "$json" != '[]' || { echo "::error::no Fuzz targets discovered"; exit 1; }
          echo "targets=$json" >> "$GITHUB_OUTPUT"
          echo "Discovered $(jq 'length' <<< "$json") Fuzz targets across $(jq '[.[].package] | unique | length' <<< "$json") packages"

  fuzz:
    needs: discover
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GTS_ISOLATED_RUNNER_LABELS != '' && fromJSON(vars.GTS_ISOLATED_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare job-owned Go cache and scratch
        if: runner.environment == 'self-hosted'
        run: bash .github/scripts/prepare_runner.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: ${{ runner.environment != 'self-hosted' }}
          go-version-file: go.mod

      - name: Fuzz ${{ matrix.target.package }} ${{ matrix.target.target }}
        id: fuzz
        shell: bash
        env:
          FUZZ_PACKAGE: ${{ matrix.target.package }}
          FUZZ_TARGET: ${{ matrix.target.target }}
          FUZZ_TIME: ${{ github.event.inputs.fuzztime || '30s' }}
        run: |
          set -uo pipefail
          GOWORK=off go test "$FUZZ_PACKAGE" -run '^$' \
            -fuzz "^${FUZZ_TARGET}\$" \
            -fuzztime "$FUZZ_TIME" 2>&1 | tee fuzz.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Record the outcome for the report job. The step fails the job only if
      # the script itself breaks; the fuzz step above keeps the job red.
      - name: Record fuzz result
        continue-on-error: true
        if: always() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        shell: bash
        env:
          FUZZ_PACKAGE: ${{ matrix.target.package }}
          FUZZ_TARGET: ${{ matrix.target.target }}
          FUZZ_RC: ${{ steps.fuzz.outputs.rc }}
        run: |
          python3 .github/scripts/fuzz_issues.py collect --log fuzz.log \
            --package "$FUZZ_PACKAGE" --target "$FUZZ_TARGET" \
            --exit-code "${FUZZ_RC:-1}" --out fuzz-result/result.json

      - name: Upload fuzz result
        continue-on-error: true
        if: always() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-result-${{ strategy.job-index }}
          path: fuzz-result/result.json
          retention-days: 7

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crasher-${{ matrix.target.target }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: '**/testdata/fuzz/${{ matrix.target.target }}'
          if-no-files-found: warn
          retention-days: 90

  # One issue per failing target, closed after N green nights. The report job
  # never fails the run: the red fuzz leg already does.
  report:
    needs: [discover, fuzz]
    if: always() && needs.discover.result == 'success' && (github.event_name == 'schedule' || github.event.inputs.report == 'true')
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GTS_ISOLATED_RUNNER_LABELS != '' && fromJSON(vars.GTS_ISOLATED_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: fuzz-nightly-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare job-owned Go cache and scratch
        if: runner.environment == 'self-hosted'
        run: bash .github/scripts/prepare_runner.sh

      # Needs python3 and gh on the runner (both ship on ubuntu-latest).
      - name: Download fuzz results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fuzz-result-*
          path: fuzz-results

      - name: Sync fuzz issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOSE_AFTER: ${{ github.event.inputs.close_after || '3' }}
        run: |
          python3 .github/scripts/fuzz_issues.py sync --results fuzz-results \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --close-after "$CLOSE_AFTER"
