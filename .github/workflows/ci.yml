  # merge-event-census-cgo runs stage M0 of spec.merge-time-election.v1: the
  # census that counts stack-merge events on both sides and breaks production's
  # refusals down by gate. Every cgo parity lane in this file runs a FIXED
  # --run regex, so a new cgo test runs nowhere unless it is named here; see
  # docs/ci-gate-coverage.md. This lane names it.
  #
  # The census needs its own build tags, so it uses the docker runner's custom
  # command form rather than --run: gts_merge_census compiles the production
  # instrument into the library, and the lane is the only place it is compiled
  # at all (merge_event_census_inert_test.go ratchets its absence everywhere
  # else). The reference side compiles the repository's own work-count patch
  # against the pinned runtime source from the module cache, so the lane needs
  # cc and git, which the harness image already carries.
  merge-event-census-cgo:
    needs: exhaustive_parity_scope
    if: needs.exhaustive_parity_scope.outputs.run_code_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Merge-event census (stage M0 baseline and Foo[int](a) receipt)
        run: |
          GTS_PARITY_MODE=smoke \
          bash cgo_harness/docker/run_parity_in_docker.sh \
            --label ci-merge-event-census \
            --memory 8g \
            --cpus 2 \
            --pids 4096 \
            --gomemlimit 6GiB \
            --goflags -p=1 \
            --test-parallel 1 \
            --c-ref-build-jobs 1 \
            --timeout 30m \
            -- "cd /workspace/cgo_harness && GOWORK=off go test \
              -tags 'cgo treesitter_c_parity gts_merge_census' \
              -run '^TestMergeEventCensus' -count=1 -v -timeout 30m ."

  parity-cgo:
    needs: exhaustive_parity_scope
    if: needs.exhaustive_parity_scope.outputs.run_code_ci == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: CGo Parity Smoke Gate
        # TestOutlineOracleDifferential (cgo_harness/outline_differential_test.go)
        # joined this regex next to its query/capture-parity sibling
        # TestParityHighlight. The Dart live-arm probe and receipt guard are
        # also named explicitly so their blocker receipt remains executable.
        # Every cgo parity lane in this file runs a FIXED --run regex, so a
        # new cgo test runs nowhere unless it is named here; see
        # docs/ci-gate-coverage.md. Its CoreNine subtest hard-gates the nine
        # core languages; its FleetCensus subtest only logs a census row, so
        # naming the whole test is safe.
        run: |
          GTS_PARITY_MODE=smoke \
          bash cgo_harness/docker/run_parity_in_docker.sh \
            --label ci-parity-cgo-smoke \
            --memory 8g \
            --cpus 2 \
            --pids 4096 \
            --gomemlimit 6GiB \
            --goflags -p=1 \
            --test-parallel 1 \
            --timeout 20m \
            --run '^TestParityFreshParse$|^TestParityIncrementalParse$|^TestParityHasNoErrors$|^TestParityIssue3Repros$|^TestParityGLRCanaryGo$|^TestParityGLRCanarySet$|^TestParityGLRCapPressureTopLanguages$|^TestParityGateCoverageRatchet$|^TestParityHighlight$|^TestOutlineOracleDifferential$|^TestParityJavaScriptAutomaticSemicolonBeforeTrailingComment$|^TestParityJavaScriptAdjacentBlockCommentsDoNotConsumeFollowingToken$|^TestIncludedRangesGoRootParity$|^TestIncludedRangesGoArmGuardsRootSymbol$|^TestIncludedRangesKotlinRootParity$|^TestDartNextLiveArmProbe$|^TestDartNextLiveArmReceiptDocument$'

  parity-cgo-exhaustive:
    needs: exhaustive_parity_scope
    if: needs.exhaustive_parity_scope.outputs.run_code_ci == 'true' && needs.exhaustive_parity_scope.outputs.run_exhaustive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: CGo Structural Parity Exhaustive (Fresh + No Errors + Issue3)
        run: |
          GTS_PARITY_MODE=exhaustive \
          bash cgo_harness/docker/run_parity_in_docker.sh \
            --label ci-parity-cgo-exhaustive-fresh \
            --memory 8g \
            --cpus 2 \
            --pids 4096 \
            --gomemlimit 6GiB \
            --goflags -p=1 \
            --test-parallel 1 \
            --timeout 30m \
            --run '^TestParityFreshParse$|^TestParityHasNoErrors$|^TestParityIssue3Repros$|^TestParityKnownDegradedStructuralStillDiverges$|^TestParityJavaScriptAutomaticSemicolonBeforeTrailingComment$|^TestParityJavaScriptAdjacentBlockCommentsDoNotConsumeFollowingToken$|^TestIncludedRangesGoRootParity$|^TestIncludedRangesGoArmGuardsRootSymbol$|^TestIncludedRangesKotlinRootParity$'

      - name: CGo Structural Parity Exhaustive (Incremental + GLR)
        run: |
          GTS_PARITY_MODE=exhaustive \
          bash cgo_harness/docker/run_parity_in_docker.sh \
            --label ci-parity-cgo-exhaustive-incremental \
            --memory 8g \
            --cpus 2 \
            --pids 4096 \
            --gomemlimit 6GiB \
            --goflags -p=1 \
            --test-parallel 1 \
            --timeout 30m \
            --run '^TestParityIncrementalParse$|^TestParityGLRCanaryGo$|^TestParityGLRCanarySet$|^TestParityGLRCapPressureTopLanguages$|^TestParityGateCoverageRatchet$'

      - name: CGo Structural Parity Exhaustive (Corpus)
        run: |
          GTS_PARITY_MODE=exhaustive \
          bash cgo_harness/docker/run_parity_in_docker.sh \
            --label ci-parity-cgo-exhaustive-corpus \
            --memory 8g \
            --cpus 2 \
            --pids 4096 \
            --gomemlimit 6GiB \
            --goflags -p=1 \
