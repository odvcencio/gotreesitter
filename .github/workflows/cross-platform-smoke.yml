name: cross-platform-smoke

# Nightly focused checks for all six v1 platforms. Native jobs run vet and
# short tests for grammars, internal, and grep. WASI runs a smaller suite.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

concurrency:
  group: cross-platform-smoke
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOWORK: 'off'

jobs:
  native:
    name: native (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 images retire on 2026-11-02 (actions/runner-images#13518).
        include:
          - {runner: ubuntu-24.04, target: linux/amd64, arch: X64}
          - {runner: ubuntu-24.04-arm, target: linux/arm64, arch: ARM64}
          - {runner: macos-15, target: darwin/arm64, arch: ARM64}
          - {runner: windows-latest, target: windows/amd64, arch: X64}
          - {runner: windows-11-arm, target: windows/arm64, arch: ARM64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Verify native toolchain
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          go version
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$EXPECTED_TARGET"
          test "$(go env GOOS)/$(go env GOARCH)" = "$EXPECTED_TARGET"

      - name: Vet
        shell: bash
        run: go vet ./grammars/... ./internal/... ./grep

      - name: Test
        shell: bash
        run: go test -short -count=1 -p 2 ./grammars/... ./internal/... ./grep

  wasip1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Go's wasip1 exec wrapper reads GOWASIRUNTIME and runs `wazero`.
      GOWASIRUNTIME: wazero
      WAZERO_VERSION: v1.9.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build every package
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: go build ./...

      - name: Install wazero
        run: go install "github.com/tetratelabs/wazero/cmd/wazero@${WAZERO_VERSION}"

      - name: Test small packages under wazero
        env:
          GOOS: wasip1
          GOARCH: wasm
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Go 1.24 moved the exec wrapper from misc/wasm to lib/wasm; go.mod
          # pins Go 1.22, so use whichever path this toolchain has.
          wasm_exec="$(go env GOROOT)/lib/wasm/go_wasip1_wasm_exec"
          [ -x "$wasm_exec" ] || wasm_exec="$(go env GOROOT)/misc/wasm/go_wasip1_wasm_exec"
          go test -short -count=1 -exec "$wasm_exec" \
            ./internal/luapattern ./internal/syntaxfacts ./internal/benchorder
