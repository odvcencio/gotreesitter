name: grammar-lock-update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: grammar-update-report
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  report-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Plan grammar updates
        run: |
          set -euo pipefail
          go run ./cmd/grammar_updater \
            -lock grammars/languages.lock \
            -allow-list grammars/update_tier1_core100.txt \
            -workers 8 \
            -report grammars/grammar_updates.plan.json \
            -fail-on-error=true

      - name: Check scanner-facing changes
        run: |
          set -euo pipefail
          go run ./cmd/grammar_update_guard \
            -updates grammars/grammar_updates.plan.json \
            -report grammars/grammar_scanner_update_report.json \
            -blocked-list grammars/grammar_held_back.txt \
            -fail-on-blocked=false

      - name: Report grammar updates in an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/render_grammar_update_issue.py \
            --plan grammars/grammar_updates.plan.json \
            --guard grammars/grammar_scanner_update_report.json \
            --output grammar_update_issue.md
          bash scripts/sync_grammar_update_issue.sh \
            grammars/grammar_updates.plan.json grammar_update_issue.md

      - name: Upload update artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grammar-lock-update-artifacts
          path: |
            grammars/grammar_updates.plan.json
            grammars/grammar_held_back.txt
            grammars/grammar_scanner_update_report.json
            grammar_update_issue.md
