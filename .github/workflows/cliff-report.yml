name: cliff-report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runner processes on the same VM share HOME and /tmp. Restore Go caches
# into job-owned directories so one job cannot overwrite another's imports,
# and keep build scratch off the host's shared temporary directory.
env:
  GOWORK: 'off'
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'

jobs:
  cliff-detector:
    # Workstream R7 reports failures. Graduation makes this gate blocking.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.GTS_ISOLATED_RUNNER_LABELS != '' && fromJSON(vars.GTS_ISOLATED_RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare job-owned Go cache and scratch
        run: bash .github/scripts/prepare_runner.sh

      - name: Measure the cliff and apply the report-only rule
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          flock /tmp/gts-docker.lock bash cgo_harness/docker/run_parity_in_docker.sh \
            --wall-timeout 140m -- "bash /workspace/scripts/run_cliff_report_in_docker.sh"

      - name: Upload the cliff report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cliff-report
          path: harness_out/cliffs/*.json
          if-no-files-found: warn
